name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_storage:
        description: Deploy Storage rules (requires Firebase Storage bucket setup)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Firebase
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          # Firebase Web SDK 公開設定（nurseboard-492316，與 .env.example 相同；
          # Web key 為公開設計，真正防護靠 Firestore rules 與 Auth。
          # 建置時必須帶入，否則產出的站台無 Firebase 設定、真實登入無法運作。
          # Firebase Hosting 掛在網域根目錄，base 必須是 /；
          # vite.config.ts 預設 production base 是 /QAweb/（給 Pages 用），
          # 沒帶這行建出來的 index.html 會去抓 /QAweb/assets/...，
          # Firebase 上沒那個路徑、改寫回 index.html，JS 載不進來就空白頁。
          VITE_BASE_PATH: /
          VITE_FIREBASE_API_KEY: AIzaSyC0l6Ci4qCYiZwWMEK-ppImCtxP8o4Q_4I
          VITE_FIREBASE_AUTH_DOMAIN: nurseboard-492316.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: nurseboard-492316
          VITE_FIREBASE_STORAGE_BUCKET: nurseboard-492316.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "807521931394"
          VITE_FIREBASE_APP_ID: "1:807521931394:web:5f5c1c51cf157bc5f0249b"
          VITE_DB_MODE: dual
          VITE_SUPABASE_URL: https://wdahafyhshsolrpsnzaz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QM3IDLu_bPSfgvOJ1g-XCA__NnZVNhQ

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Firebase Storage rules
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_storage }}
        run: firebase deploy --only storage --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
