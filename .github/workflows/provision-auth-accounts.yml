name: Provision auth accounts

# 登入帳號對帳：以 Supabase 人員名單為準，讓 Firebase 登入帳號與名單一致（email＝職編去掉
# 開頭 0＋@kmuh.org.tw）。每小時自動執行，也可手動執行（建議先勾 dry_run 預覽）：
#   - 建立名單有、但沒有登入帳號者（隨機密碼，寫入 role／staffId 標記）；人員再到登入頁按「開通帳號」
#   - 「停用」者停用登入、改回在職者啟用
#   - 刪除名單已不存在的帳號與其 Firestore users 文件（admin@kmuh.org.tw 永遠保留）
# 安全上限：名單讀不到或是空的就不動作；一次要刪的帳號超過 max_delete（預設 20）整批不刪並失敗。
# 手動選項 prune_firestore：另外清掉 Firestore users 中名單沒有的文件（會逐筆讀 Firestore，耗讀取額度）。
# 需要 secrets：FIREBASE_SERVICE_ACCOUNT（服務帳戶 JSON 全文）、SUPABASE_SERVICE_ROLE_KEY（Supabase
#   Project Settings → API 的 service_role，只放這裡，不要放進程式碼）。
# 選用 variable：KEEP_EMAILS（逗號分隔，額外永遠保留的登入信箱）。

on:
  schedule:
    - cron: "11 * * * *" # 每小時（UTC）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只預覽，不寫入"
        type: boolean
        default: false
      max_accounts:
        description: "單次最多建立幾個帳號"
        type: string
        default: "500"
      max_delete:
        description: "單次最多刪除幾個帳號（超過整批不刪）"
        type: string
        default: "20"
      prune_firestore:
        description: "另外清掉 Firestore users 中名單沒有的文件（耗讀取額度）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-auth-accounts
  cancel-in-progress: false

jobs:
  provision:
    name: Reconcile Firebase accounts with roster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Prepare tool directory
        run: |
          mkdir -p "$RUNNER_TEMP/provision"
          cp scripts/provision-auth-accounts.mts "$RUNNER_TEMP/provision/"
          cd "$RUNNER_TEMP/provision"
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin tsx

      - name: Write service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then echo "::error::缺少 secret FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          SUPABASE_URL: https://wdahafyhshsolrpsnzaz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEEP_EMAILS: ${{ vars.KEEP_EMAILS }}
          DRY: ${{ inputs.dry_run == true && '--dry-run' || '' }}
          PRUNE: ${{ inputs.prune_firestore == true && '--prune-firestore' || '' }}
          MAX: ${{ inputs.max_accounts }}
          MAXDEL: ${{ inputs.max_delete }}
        run: |
          cd "$RUNNER_TEMP/provision"
          npx tsx provision-auth-accounts.mts $DRY $PRUNE --max="${MAX:-500}" --max-delete="${MAXDEL:-20}"

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
