name: Test (split baseline)

# 拆分期間用：不部署、不寫入任何資料，只做邊界檢查與測試基準比對。
on:
  pull_request:
    branches: [main, refactor/split-pages]
  push:
    branches: [refactor/split-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boundary check (blocking)
        run: pnpm check:boundaries

      - name: Type check and build (blocking)
        run: pnpm build

      # 舊測試需要 esbuild／jsdom；不寫入 package.json／lockfile（避免動到 deploy 的 frozen-lockfile），僅暫時安裝。
      - name: Install test-only tools (ephemeral)
        run: pnpm add -D esbuild@0.28.2 jsdom@^26.1.0

      - name: Baseline tests (report only)
        continue-on-error: true
        run: node scripts/run-tests.mjs --require-deps
